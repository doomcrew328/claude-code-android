name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=warning install.sh install-pinned.sh migrate.sh tests/verify-claims.sh scripts/check-termux-env.sh scripts/fix-ripgrep.sh scripts/config-validator.sh scripts/check-sync.sh tests/ssrf-guard-tests.sh examples/ssrf-guard.sh examples/fingerprint-gate.sh tests/fwextract-crosscheck.sh

      - name: Check install.sh / migrate.sh sync
        run: bash scripts/check-sync.sh
