name: Firmware extractor

on:
  push:
    paths:
      - "tools/fwextract.py"
      - "tests/fwextract-tests.py"
      - "tests/fwextract-crosscheck.sh"
      - "tools/setup-fwextract.sh"
      - ".github/workflows/fwextract.yml"
  pull_request:
    paths:
      - "tools/fwextract.py"
      - "tests/fwextract-tests.py"
      - "tests/fwextract-crosscheck.sh"
      - "tools/setup-fwextract.sh"
      - ".github/workflows/fwextract.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Stdlib only: the tool must work with nothing but `pkg install python`.
      - name: Tests (standard library only)
        run: python tests/fwextract-tests.py -v

      # The optional modules are only used to build lz4/zstd/brotli fixtures
      # and to cross-check the pure-Python LZ4 decoder.
      - name: Tests (with optional compression modules)
        run: |
          pip install lz4 zstandard brotli
          python tests/fwextract-tests.py -v

  # Build fixtures with Google's own tools (mkbootimg, img2simg, mkfs.erofs)
  # and compare against unpack_bootimg / simg2img and the original inputs.
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AOSP reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mkbootimg android-sdk-libsparse-utils erofs-utils \
            e2fsprogs lz4 zstd brotli cpio xz-utils

      - name: Cross-check against AOSP tools
        run: bash tests/fwextract-crosscheck.sh

      - name: Setup script installs a working fwextract
        run: |
          sudo bash tools/setup-fwextract.sh
          fwextract --check
